<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行程｜PeakTrace 百岳完登紀錄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/peak-map.js"></script>
</head>
<body>
<script type="module">
  import {
    initPage, run, esc, params, flash, showAlert, todayTaipei, dateRange, weatherDays,
    loadPeaks, listUsers, listClimbs, doneMap, addClimbs, getPlan, joinPlan, leavePlan, deletePlan,
  } from './js/app.js';
  import { getTripWeather } from './js/weather.js';

  run(async () => {
    const { user, main } = initPage({ title: '行程', active: 'plans.html' });
    const id = params.get('id');
    const [plan, allPeaks, users] = await Promise.all([id ? getPlan(id) : null, loadPeaks(), listUsers()]);
    if (!plan) { main.innerHTML = '<div class="card p-4">找不到這個行程，可能已被取消。</div>'; return; }
    document.title = `${plan.title}｜PeakTrace`;

    const today = todayTaipei();
    const peaks = allPeaks.filter((p) => plan.peak_nos.includes(p.no));
    const userById = new Map(users.map((u) => [u.id, u]));
    const members = plan.member_ids.map((mid) => userById.get(mid)).filter(Boolean);
    const memberDone = new Map(await Promise.all(members.map(async (m) => [m.id, doneMap(await listClimbs({ userId: m.id }))])));
    const isMember = plan.member_ids.includes(user.id);
    const isCreator = plan.creator_id === user.id;
    const daysLeft = Math.round((Date.parse(plan.start_date) - Date.parse(today)) / 86400000);
    const ended = plan.end_date < today;
    const lastClimbDate = ended ? plan.end_date : today;

    main.innerHTML = `
<div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
  <div>
    <h1 class="h3 mb-1">${esc(plan.title)}</h1>
    <div class="text-body-secondary">
      <i class="bi bi-calendar-event"></i> ${dateRange(plan.start_date, plan.end_date)}
      ${daysLeft > 0 ? `<span class="badge text-bg-warning ms-1">倒數 ${daysLeft} 天</span>`
        : !ended ? '<span class="badge text-bg-success ms-1">進行中</span>' : '<span class="badge text-bg-secondary ms-1">已結束</span>'}
      · 發起人 ${esc(plan.creator_name)}
    </div>
  </div>
  <div class="d-flex gap-2">
    ${!isMember && !ended ? '<button class="btn btn-success" data-action="join"><i class="bi bi-person-plus"></i> 我要參加</button>' : ''}
    ${isMember && !isCreator && !ended ? '<button class="btn btn-outline-secondary" data-action="leave">退出行程</button>' : ''}
    ${isCreator ? '<button class="btn btn-outline-danger" data-action="delete">取消行程</button>' : ''}
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-lg-4">
    <div class="card p-3 mb-3">
      <div class="fw-semibold mb-2">行程資訊</div>
      <div class="small mb-1"><i class="bi bi-geo"></i> 集合：${esc(plan.meeting_point) || '未設定'}</div>
      ${plan.notes ? `<div class="small" style="white-space: pre-wrap">${esc(plan.notes)}</div>` : ''}
    </div>
    <div class="card p-3">
      <div class="fw-semibold mb-2">參加山友（${members.length}）</div>
      <ul class="list-group list-group-flush">
        ${members.map((m) => { const d = memberDone.get(m.id); const n = peaks.filter((p) => d.has(p.no)).length; return `
        <li class="list-group-item px-0 d-flex justify-content-between">
          <a href="index.html?user=${encodeURIComponent(m.id)}">${esc(m.display_name)}</a>
          <span class="small text-body-secondary">百岳 ${d.size} 座 · 本次目標已登 ${n}/${peaks.length}</span>
        </li>`; }).join('')}
      </ul>
    </div>
  </div>
  <div class="col-lg-8"><div class="card p-3 h-100"><div id="map" class="peak-map h-100" style="min-height:360px"></div></div></div>
</div>

<div class="card p-3 mb-3">
  <div class="fw-semibold mb-2"><i class="bi bi-flag"></i> 目標資訊</div>
  <div class="table-responsive">
  <table class="table table-sm mb-0">
    <thead><tr><th>編號</th><th>百岳</th><th>高度</th><th>縣市 / 區域</th><th>山脈</th><th>路線</th><th>國家公園</th><th>分級</th><th>座標</th></tr></thead>
    <tbody>${peaks.map((p) => `
      <tr>
        <td>#${p.no}</td>
        <td><a href="peak.html?no=${p.no}" class="fw-semibold">${esc(p.name)}</a></td>
        <td>${p.elevation} m</td>
        <td class="small">${esc(p.counties)} / ${p.region}</td>
        <td class="small">${esc(p.range_name)}</td>
        <td class="small">${esc(p.route)}</td>
        <td class="small">${esc(p.national_park) || '—'}</td>
        <td>${p.grade ?? '—'}</td>
        <td class="small"><a href="${p.google_maps_url}" target="_blank" rel="noopener"><i class="bi bi-geo-alt"></i> Google</a></td>
      </tr>`).join('')}
    </tbody>
  </table>
  </div>
</div>

<div class="card p-3 mb-3">
  <div class="fw-semibold mb-1"><i class="bi bi-cloud-sun"></i> 山頂氣候</div>
  <div id="weather"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
</div>

${isMember && plan.start_date <= today ? `
<div class="card p-3 border border-success">
  <div class="fw-semibold mb-2"><i class="bi bi-check2-circle"></i> 登記本次完登</div>
  <form id="completeForm" class="d-flex flex-wrap gap-3 align-items-end">
    <div>${peaks.map((p) => `
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="peaks" value="${p.no}" id="cp${p.no}" checked>
        <label class="form-check-label" for="cp${p.no}">${esc(p.name)}${memberDone.get(user.id)?.has(p.no) ? '（已完登過）' : ''}</label>
      </div>`).join('')}
    </div>
    <div><label class="form-label small mb-0">完登日期</label>
      <input type="date" class="form-control form-control-sm" name="climbDate" min="${plan.start_date}" max="${lastClimbDate}" value="${lastClimbDate}"></div>
    <button class="btn btn-success btn-sm">登記完登</button>
  </form>
</div>` : ''}`;

    // 地圖
    const targets = peaks.filter((p) => p.lat != null);
    const map = PeakMap.create(document.getElementById('map'));
    targets.forEach((p) => PeakMap.marker(p, PeakMap.COLORS.target, 10).bindPopup(PeakMap.popupHtml(p)).addTo(map));
    if (targets.length) map.fitBounds(L.latLngBounds(targets.map((p) => [p.lat, p.lng])).pad(0.5), { maxZoom: 12 });

    // 按鈕
    const actions = {
      join: async () => { await joinPlan(plan.id, user.id); flash('success', '已報名這次行程'); },
      leave: async () => { await leavePlan(plan.id, user.id); flash('success', '已退出行程'); },
      delete: async () => {
        if (!confirm('確定取消這個行程？')) return false;
        await deletePlan(plan.id);
        flash('success', '行程已取消');
        location.href = 'plans.html';
        return false;
      },
    };
    main.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        if ((await actions[btn.dataset.action]()) !== false) location.reload();
      } catch (err) {
        showAlert('danger', err.message);
      }
      btn.disabled = false;
    }));

    document.getElementById('completeForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const nos = [...f.querySelectorAll('[name=peaks]:checked')].map((x) => Number(x.value));
      const climbDate = f.climbDate.value || lastClimbDate;
      if (!nos.length) return showAlert('danger', '請至少勾選一座百岳');
      if (climbDate > todayTaipei()) return showAlert('danger', '完登日期不能晚於今天');
      const added = await addClimbs(user.id, nos, climbDate, `行程：${plan.title}`, plan.id);
      flash('success', `已新增 ${added} 筆完登紀錄 🎉`);
      location.reload();
    });

    // 天氣
    const wx = document.getElementById('weather');
    const fmt = (n, d = 0) => (n == null ? '—' : n.toFixed(d));
    try {
      const w = await getTripWeather(peaks, plan.start_date, plan.end_date);
      if (w.mode === 'past') wx.innerHTML = '<div class="text-body-secondary small">行程已結束。</div>';
      else if (w.mode === 'none') wx.innerHTML = '<div class="text-body-secondary small">沒有座標資料。</div>';
      else if (w.mode === 'forecast') {
        wx.innerHTML = `<div class="text-body-secondary small mb-2">Open-Meteo 逐日預報（已依山頂高度修正氣溫），橘框為行程日期。
          ${w.partial ? `部分日期超出預報範圍（最遠至 ${w.lastForecast}）。` : ''}</div>`
          + peaks.filter((p) => w.perPeak.has(p.no)).map((p) => `
          <div class="mt-2 mb-1 fw-semibold small">#${p.no} ${esc(p.name)}（${p.elevation} m）</div>${weatherDays(w.perPeak.get(p.no))}`).join('');
      } else {
        wx.innerHTML = `<div class="text-body-secondary small mb-2">出發日超過 16 天預報範圍，以下為<b>過去幾年同期</b>的實際觀測作為參考；
          ${w.forecastFrom} 起可看到正式預報。</div>
        <div class="table-responsive"><table class="table table-sm mb-0">
          <thead><tr><th>百岳</th><th>平均高溫</th><th>平均低溫</th><th>日均雨量</th><th>降雨日比例</th><th>歷年同期</th></tr></thead>
          <tbody>${peaks.filter((p) => w.perPeak.has(p.no)).map((p) => { const c = w.perPeak.get(p.no); return `
            <tr>
              <td>#${p.no} ${esc(p.name)}</td>
              <td class="text-danger">${fmt(c.avgTmax, 1)}°C</td>
              <td class="text-primary">${fmt(c.avgTmin, 1)}°C</td>
              <td>${fmt(c.avgPrecip, 1)} mm</td>
              <td>${c.rainChance == null ? '—' : `${Math.round(c.rainChance * 100)}%`}</td>
              <td class="small">${c.years.map((y) => `<span class="me-2 text-nowrap" title="${esc(y.text)}">${y.year}: ${y.icon} ${Math.round(y.tmin)}~${Math.round(y.tmax)}° ${y.precip.toFixed(0)}mm</span>`).join('')}</td>
            </tr>`; }).join('')}
          </tbody></table></div>`;
      }
    } catch (e) {
      wx.innerHTML = `<div class="text-danger small">無法取得天氣資料：${esc(e.message)}</div>`;
    }
  });
</script>
</body>
</html>
