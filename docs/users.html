<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>山友排行｜PeakTrace 百岳完登紀錄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script type="module">
  import { initPage, run, esc, listUsers, listClimbs } from './js/app.js';

  run(async () => {
    const { user, main } = initPage({ title: '山友排行' });
    const [users, climbs] = await Promise.all([listUsers(), listClimbs()]);
    const rows = users.map((u) => {
      const mine = climbs.filter((c) => c.user_id === u.id);
      return {
        ...u,
        done: new Set(mine.map((c) => c.peak_no)).size,
        last_climb: mine.reduce((m, c) => (!m || c.climb_date > m ? c.climb_date : m), null),
      };
    }).sort((a, b) => b.done - a.done || (b.last_climb ?? '').localeCompare(a.last_climb ?? ''));

    main.innerHTML = `
<h1 class="h3 mb-3">山友排行</h1>
<div class="card p-3">
  <div class="table-responsive">
  <table class="table table-hover mb-0">
    <thead><tr><th>#</th><th>山友</th><th>完登</th><th style="width:40%">進度</th><th>最近登頂</th></tr></thead>
    <tbody>${rows.map((u, i) => `
      <tr class="${u.id === user.id ? 'table-success' : ''}">
        <td>${i + 1}</td>
        <td><a href="index.html?user=${encodeURIComponent(u.id)}">${esc(u.display_name)}</a></td>
        <td>${u.done} / 100</td>
        <td><div class="progress"><div class="progress-bar bg-success" style="width: ${u.done}%"></div></div></td>
        <td class="small">${u.last_climb ?? '—'}</td>
      </tr>`).join('')}
    </tbody>
  </table>
  </div>
</div>`;
  });
</script>
</body>
</html>
