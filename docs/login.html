<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜PeakTrace 百岳完登紀錄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<script type="module">
  import { initPage, run, login, currentUser, flash, showAlert, busy } from './js/app.js';

  run(async () => {
    const { main } = initPage({ title: '登入', requireLogin: false });
    if (currentUser()) return location.replace('index.html');
    main.innerHTML = `
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4">
      <h1 class="h4 mb-3 text-center"><i class="bi bi-triangle-fill text-success"></i> 登入 PeakTrace</h1>
      <form id="loginForm">
        <div class="mb-3"><label class="form-label">帳號</label>
          <input class="form-control" name="username" maxlength="30" required autofocus>
          <div class="form-text">輸入帳號即可登入，新帳號會自動建立。</div></div>
        <button class="btn btn-success w-100">登入</button>
      </form>
    </div>
  </div>
</div>`;
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = form.username.value.trim();
      if (!username) return;
      busy(form, true);
      try {
        if (await login(username)) flash('success', '帳號建立成功，開始記錄你的百岳吧！');
        const returnTo = sessionStorage.getItem('returnTo');
        sessionStorage.removeItem('returnTo');
        location.href = returnTo || 'index.html';
      } catch (err) {
        showAlert('danger', `登入失敗：${err.message}`);
        busy(form, false);
      }
    });
  });
</script>
</body>
</html>
