<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeakTrace 百岳完登紀錄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/peak-map.js"></script>
</head>
<body>
<script type="module">
  import { initPage, run, esc, params, dateRange, currentUser, loadPeaks, getUser, listClimbs, listPlans, userStats } from './js/app.js';

  run(async () => {
    const viewId = params.get('user');
    const { user, main } = initPage({ title: '儀表板', active: viewId && viewId !== currentUser()?.id ? 'users.html' : 'index.html' });
    const uid = viewId || user.id;
    const isSelf = uid === user.id;

    const [peaks, profile, climbs, plans] = await Promise.all([
      loadPeaks(), getUser(uid), listClimbs({ userId: uid }), listPlans({ upcoming: true, userId: uid }),
    ]);
    if (!profile) { main.innerHTML = '<div class="card p-4">找不到這位使用者。</div>'; return; }
    document.title = `${isSelf ? '我的儀表板' : `${profile.display_name} 的百岳`}｜PeakTrace`;
    const stats = userStats(peaks, climbs);
    const byNo = new Map(peaks.map((p) => [p.no, p]));
    const recent = climbs.slice(0, 8);
    const maxN = Math.max(1, ...stats.byYear.map((y) => y.n));

    main.innerHTML = `
<div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2">
  <h1 class="h3 mb-0">${isSelf ? '我的百岳儀表板' : `${esc(profile.display_name)} 的百岳`}</h1>
  ${isSelf ? `<div class="d-flex gap-2">
    <a href="climbs.html" class="btn btn-success"><i class="bi bi-plus-lg"></i> 新增完登</a>
    <a href="plan-new.html" class="btn btn-outline-success"><i class="bi bi-calendar-plus"></i> 約爬山</a>
  </div>` : ''}
</div>

<div class="row g-3 mb-3">
  <div class="col-lg-4">
    <div class="card h-100 p-4">
      <div class="progress-ring" style="--p: ${stats.percent}">
        <div><div><div class="stat-big">${stats.done}</div><div class="stat-label">/ ${stats.total} 座</div></div></div>
      </div>
      <div class="text-center mt-3">
        <div class="fs-5 fw-semibold">完成 ${stats.percent}%</div>
        <div class="text-body-secondary small">${stats.remaining === 0 ? '恭喜完登百岳！🎉' : `還差 ${stats.remaining} 座就完登百岳`}</div>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="row g-3 h-100">
      <div class="col-6 col-md-3"><div class="card p-3 h-100"><div class="stat-label">已完登</div><div class="fs-2 fw-bold">${stats.done}</div></div></div>
      <div class="col-6 col-md-3"><div class="card p-3 h-100"><div class="stat-label">登頂次數</div><div class="fs-2 fw-bold">${stats.totalClimbs}</div></div></div>
      <div class="col-6 col-md-3"><div class="card p-3 h-100"><div class="stat-label">最高登頂</div>
        <div class="fs-5 fw-bold">${stats.highest ? esc(stats.highest.name) : '—'}</div>
        <div class="small text-body-secondary">${stats.highest ? `${stats.highest.elevation} m` : ''}</div></div></div>
      <div class="col-6 col-md-3"><div class="card p-3 h-100"><div class="stat-label">累積高度</div>
        <div class="fs-5 fw-bold">${stats.totalElevation.toLocaleString()} m</div></div></div>
      <div class="col-12">
        <div class="card p-3 h-100">
          <div class="fw-semibold mb-2">分區完成度</div>
          ${stats.byRegion.map((r) => { const pct = Math.round((r.done / r.total) * 100); return `
          <div class="d-flex align-items-center mb-2">
            <div style="width:3.5rem" class="small">${r.region}</div>
            <div class="progress flex-grow-1" style="height: 1.1rem">
              <div class="progress-bar bg-success" style="width: ${pct}%">${pct >= 12 ? `${pct}%` : ''}</div>
            </div>
            <div class="small ms-2 text-end" style="width:4rem">${r.done} / ${r.total}</div>
          </div>`; }).join('')}
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-lg-8">
    <div class="card p-3"><div class="fw-semibold mb-2">完登地圖</div><div id="map" class="peak-map"></div></div>
  </div>
  <div class="col-lg-4">
    <div class="card p-3 mb-3">
      <div class="fw-semibold mb-2">最近完登</div>
      ${recent.length ? '' : `<div class="text-body-secondary small">尚無紀錄${isSelf ? '，到「登山紀錄」新增第一座百岳吧！' : ''}</div>`}
      <ul class="list-group list-group-flush">
        ${recent.map((c) => `<li class="list-group-item px-0 d-flex justify-content-between">
          <a href="peak.html?no=${c.peak_no}" class="text-decoration-none">#${c.peak_no} ${esc(byNo.get(c.peak_no)?.name)}</a>
          <span class="text-body-secondary small">${c.climb_date}</span></li>`).join('')}
      </ul>
    </div>
    <div class="card p-3 mb-3">
      <div class="fw-semibold mb-2">即將出發的行程</div>
      ${plans.length ? '' : '<div class="text-body-secondary small">目前沒有報名的行程</div>'}
      ${plans.slice(0, 5).map((pl) => `<a href="plan.html?id=${pl.id}" class="d-block text-decoration-none mb-2">
          <div class="fw-semibold">${esc(pl.title)}</div>
          <div class="small text-body-secondary"><i class="bi bi-calendar-event"></i> ${dateRange(pl.start_date, pl.end_date)} · ${pl.member_ids.length} 人</div></a>`).join('')}
    </div>
    ${stats.byYear.length ? `<div class="card p-3">
      <div class="fw-semibold mb-2">每年新完登</div>
      ${stats.byYear.map((y) => `<div class="d-flex align-items-center mb-1 small">
        <div style="width:3rem">${y.year}</div>
        <div class="progress flex-grow-1" style="height:.8rem"><div class="progress-bar bg-success" style="width: ${(y.n / maxN) * 100}%"></div></div>
        <div style="width:2.5rem" class="text-end">${y.n}</div></div>`).join('')}
    </div>` : ''}
  </div>
</div>`;

    const map = PeakMap.create(document.getElementById('map'));
    stats.peaks.filter((p) => p.lat != null).forEach((p) => {
      PeakMap.marker(p, p.done ? PeakMap.COLORS.done : PeakMap.COLORS.todo, p.done ? 8 : 6).bindPopup(PeakMap.popupHtml(p)).addTo(map);
    });
    PeakMap.legend(map, [['已完登', PeakMap.COLORS.done], ['未完登', PeakMap.COLORS.todo]]);
  });
</script>
</body>
</html>
