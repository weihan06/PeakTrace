<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登山紀錄｜PeakTrace 百岳完登紀錄</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/peak-map.js"></script>
  <script src="js/peak-picker.js"></script>
</head>
<body>
<script type="module">
  import {
    initPage, run, esc, params, flash, showAlert, busy, isDate, todayTaipei,
    loadPeaks, listClimbs, addClimbs, deleteClimb, doneMap,
  } from './js/app.js';

  run(async () => {
    const { user, main } = initPage({ title: '登山紀錄' });
    const today = todayTaipei();
    const [peaks, climbs] = await Promise.all([loadPeaks(), listClimbs({ userId: user.id })]);
    const byNo = new Map(peaks.map((p) => [p.no, p]));
    const done = doneMap(climbs);

    main.innerHTML = `
<h1 class="h3 mb-3">登山紀錄</h1>
<div class="card p-3 mb-4">
  <div class="fw-semibold mb-2"><i class="bi bi-plus-circle"></i> 新增完登</div>
  <form id="climbForm">
    <div class="row g-3">
      <div class="col-lg-5">
        <label class="form-label">① 選擇百岳 <small class="text-body-secondary">（可複選，也可直接點地圖）</small></label>
        <select id="peakSelect" name="peaks" multiple required></select>
        <div class="row g-2 mt-2">
          <div class="col-sm-6"><label class="form-label">② 完登日期</label>
            <input type="date" class="form-control" name="climbDate" max="${today}" value="${today}" required></div>
          <div class="col-sm-6"><label class="form-label">備註</label>
            <input class="form-control" name="note" maxlength="200" placeholder="例：雪東線兩天一夜"></div>
        </div>
        <button class="btn btn-success mt-3 w-100"><i class="bi bi-check2-circle"></i> 登記完登</button>
      </div>
      <div class="col-lg-7"><div id="pickMap" class="peak-map"></div></div>
    </div>
  </form>
</div>

<div class="card p-3">
  <div class="fw-semibold mb-2">我的紀錄（${climbs.length} 筆）</div>
  ${!climbs.length ? '<div class="text-body-secondary">還沒有任何紀錄。</div>' : `
  <div class="table-responsive">
  <table class="table table-hover mb-0">
    <thead><tr><th>完登日期</th><th>編號</th><th>百岳</th><th>高度</th><th>縣市</th><th>區域</th><th>備註</th><th></th></tr></thead>
    <tbody>${climbs.map((c) => { const p = byNo.get(c.peak_no) ?? {}; return `
      <tr>
        <td>${c.climb_date}</td><td>#${c.peak_no}</td>
        <td><a href="peak.html?no=${c.peak_no}">${esc(p.name)}</a></td>
        <td>${p.elevation} m</td><td class="small">${esc(p.counties)}</td><td>${esc(p.region)}</td>
        <td class="small">${esc(c.note)}</td>
        <td class="text-end"><button class="btn btn-sm btn-outline-danger" data-delete="${esc(c.id)}"><i class="bi bi-trash"></i></button></td>
      </tr>`; }).join('')}
    </tbody>
  </table>
  </div>`}
</div>`;

    const preselect = params.getAll('peak').map(Number);
    initPeakPicker({
      select: '#peakSelect',
      map: document.getElementById('pickMap'),
      peaks: peaks.map((p) => ({ ...p, done: done.get(p.no) ?? null })),
      preselect,
    });

    const form = document.getElementById('climbForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nos = ($('#peakSelect').val() || []).map(Number);
      const climbDate = form.climbDate.value;
      if (!nos.length) return showAlert('danger', '請至少選擇一座百岳');
      if (!isDate(climbDate)) return showAlert('danger', '請選擇完登日期');
      if (climbDate > todayTaipei()) return showAlert('danger', '完登日期不能晚於今天');
      busy(form, true);
      try {
        const added = await addClimbs(user.id, nos, climbDate, form.note.value.trim());
        flash('success', added ? `已新增 ${added} 筆完登紀錄 🎉` : '這些紀錄已經存在');
        location.href = 'climbs.html';
      } catch (err) {
        showAlert('danger', `儲存失敗：${err.message}`);
        busy(form, false);
      }
    });

    main.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', async () => {
      if (!confirm('確定刪除這筆紀錄？')) return;
      btn.disabled = true;
      await deleteClimb(btn.dataset.delete);
      flash('success', '已刪除紀錄');
      location.reload();
    }));
  });
</script>
</body>
</html>
